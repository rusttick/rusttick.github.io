<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lights Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Lights Controller</h1>

        <div id="error" class="error"></div>

        <div class="status">
            <p><b>Uptime:</b> <span id="uptime">--</span></p>
            <p><b>Pattern:</b> <span id="pattern-display">--</span></p>
            <p><b>Desired Brightness:</b> <span id="brightness-desired">--</span></p>
            <p><b>Actual Brightness:</b> <span id="brightness-actual">--</span></p>
            <p><b>Voltage (raw):</b> <span id="voltage-raw">--</span></p>
            <p><b>Voltage (smoothed):</b> <span id="voltage-smoothed">--</span></p>
            <p><b>Voltage (predicted):</b> <span id="voltage-predicted">--</span></p>
            <p><b>Voltage trend:</b> <span id="voltage-trend">--</span></p>
        </div>

        <div class="controls">
            <label for="pattern">Pattern:</label>
            <select name="pattern" id="pattern"></select>

            <label for="brightness">Brightness:</label>
            <div class="brightness-value" id="brightness-label">50%</div>
            <input type="range" name="brightness" id="brightness" min="0" max="100" value="50">

            <div class="buttons">
                <button type="button" id="apply-btn">Apply</button>
                <button type="button" id="refresh-btn" class="secondary">Refresh</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
